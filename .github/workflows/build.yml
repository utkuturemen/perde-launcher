name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir out
          cp app/build/outputs/apk/release/*.apk "out/Perde-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Perde-apk
          path: out/*.apk

      - name: Publish APK to builds branch
        run: |
          cd out
          git init -q -b builds
          cp "Perde-${{ github.run_number }}.apk" Perde-latest.apk
          cp "Perde-${{ github.run_number }}.apk" perde.apk
          echo '{"versionCode": ${{ github.run_number }}}' > version.json
          git add .
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "Build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" builds
